name: Release UbuntuMono

on:
  workflow_dispatch:

# Required to upload/replace an asset on an existing GitHub Release.
permissions:
  contents: write

jobs:
  release-ubuntumono:
    name: Build and publish UbuntuMono.zip
    # Pin the runner instead of following ubuntu-latest as it migrates.
    runs-on: ubuntu-24.04

    steps:
      - name: Find the latest published release in this repository
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"

          if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
            echo "::error::No published, non-draft, non-prerelease release was found in ${GITHUB_REPOSITORY}."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Using this repository's latest release: ${TAG}"

      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.latest.outputs.tag }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fontforge \
            python3-fontforge \
            jq \
            xz-utils \
            zip

      - name: Verify FontForge
        shell: bash
        run: |
          set -euo pipefail
          fontforge --version
          python3 -c 'import fontforge; print("FontForge Python bindings are available.")'

      - name: Patch Ubuntu Mono only
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/bin/scripts"

          fontforge --script "${GITHUB_WORKSPACE}/font-patcher" --version

          ./gotta-patch-em-all-font-patcher\!.sh -jp "/UbuntuMono"

      - name: Create UbuntuMono.zip
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/bin/scripts"

          ./archive-fonts.sh UbuntuMono

          test -s "${GITHUB_WORKSPACE}/archives/UbuntuMono.zip"
          echo "Created archives/UbuntuMono.zip"
          ls -lh "${GITHUB_WORKSPACE}/archives/UbuntuMono.zip"

      - name: Upload or replace UbuntuMono.zip on the existing release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.latest.outputs.tag }}
          files: archives/UbuntuMono.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
